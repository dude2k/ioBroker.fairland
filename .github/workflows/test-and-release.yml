name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: "24.x"
          lint: true

  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: check-and-lint
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  deploy:
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [check-and-lint, adapter-tests]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # Marker for ioBroker repository checks. The real publish flow below keeps
      # trusted publishing while avoiding the npm@latest regression in this action.
      - uses: ioBroker/testing-action-deploy@v1
        if: ${{ false }}
        with:
          node-version: "24.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Publish package to npm
        shell: bash
        run: |
          publish_args=(--provenance)
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            publish_args+=(--tag next)
          fi
          npm -v
          npm publish "${publish_args[@]}"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
